name = lolAccessibility
summary = "League & Riot Accessibility"
description = """Melhora significativamente a acessibilidade do Riot Client e do League of Legends para usuários do NVDA.

Recursos principais:
- Engenharia reversa (REA) da arquitetura Electron e API REST local do Riot Client.
- Inicialização direta do League of Legends pelo Riot Client sem cliques de mouse (Ctrl+Shift+J ou NVDA+Shift+J).
- Aceitação instantânea e automática de Termos de Serviço / EULA via API nativa (Ctrl+Shift+T ou NVDA+Shift+T).
- Consulta de amigos online e atividades de jogo no Riot Client (Ctrl+Shift+F ou NVDA+Shift+F).
- Elimina o anúncio constante de 'animation' e avisos de imagens sem descrição do Chromium.
- Rotulação semântica acessível de botões de controle, perfil, configurações, carrossel e botões de ação principal (CTA).
- Atalho dedicado (Ctrl+Shift+D ou NVDA+Shift+D) para anunciar velocidade e progresso de download/instalação.
- Atalho (Ctrl+Shift+S ou NVDA+Shift+S) para anunciar nome de usuário (Riot ID) e status.
- Alerta sonoro imediato de Partida Encontrada (Ready Check) com tecla rápida F6 para aceitar sem usar o mouse.
- Modo de Aceitação Automática opcional (Ctrl+Shift+F6).
- Anúncio de fase, escolhas, banimentos e cronômetro na Seleção de Campeões (Ctrl+Shift+C).
- Leitor automático de mensagens do chat do grupo e saguão.
- Central de Acessibilidade / LoL Hub (Ctrl+Shift+A ou NVDA+Shift+A) para iniciar Tutoriais, criar saguões, resgatar recompensas, verificar Vanguard e configurar vídeo.
- Navegação direta e semântica nos menus superiores, abas sociais e game hub do Riot Client:
  * Ctrl+Shift+U / NVDA+Shift+U: Focar Menu da Conta e Perfil (com anúncio de Riot ID, status online e acesso a Configurações, Segurança e Detalhes).
  * Ctrl+Shift+O / NVDA+Shift+O: Focar Guias Sociais (Amigos, Conversas, Pedidos de amizade) com contagem de posição ("1 de 3").
  * Ctrl+Shift+H / NVDA+Shift+H: Focar Guias Centrais do Game Hub (Visão Geral, Notas de Atualização, eSports, Pick'Ems) ("1 de 4").
  * Ctrl+Shift+A / NVDA+Shift+A: Focar diretamente o campo para Adicionar Amigo (Riot ID).
  * Rotulação semântica completa dos campos de texto ("Riot ID do amigo" e "Tagline (#TAG, ex: BR1)") com instruções de preenchimento.
  * Rótulos intuitivos para controles de mídia do Game Hub (Vídeo promocional, Áudio/Volume) e cards de destaque.
  * Supressão total de nós decorativos e ruídos de "animation botão" em ícones Lottie e SVGs internos.
"""
author = "Jhonata <jhonata@acessibilidade.dev>"
url = https://github.com/jhonata192/lolAccessibility
version = 1.5.1
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.2
docFileName = readme.html
